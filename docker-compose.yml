services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      # Check every 2s while starting up, then only every 60s (was every 5s forever).
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  site-backend:
    build: ./backend/site
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/skane_site
      DB_SSL: "false"
      FRONTEND_URL: https://skanetamilsangam.duckdns.org
      JWT_SECRET: ${SITE_JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget is tiny; starting a whole extra node process every 5s was the main idle CPU cost.
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  food-backend:
    build: ./backend/food
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/click2eat
      DB_SSL: "false"
      JWT_SECRET: ${FOOD_JWT_SECRET}
      SITE_BACKEND_URL: http://site-backend:3001
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget is tiny; starting a whole extra node process every 5s was the main idle CPU cost.
      test: ["CMD", "wget", "-q", "-T", "4", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      PORT: 80
      SITE_BACKEND_HOSTPORT: site-backend:3001
      FOOD_BACKEND_HOSTPORT: food-backend:3000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      site-backend:
        condition: service_healthy
      food-backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
