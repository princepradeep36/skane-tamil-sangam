<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your Skåne Tamil Sangam account password.">
    <title>Reset Password | Skåne Tamil Sangam</title>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="animate-fade-in"
    style="background: linear-gradient(135deg, #fdfaf6 0%, #e6f0ff 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">

    <div class="container" style="max-width: 480px; width: 100%;">
        <div class="registration-card animate-fade-in" style="padding: 3.5rem; margin: 0; animation-delay: 0.1s;">
            <div class="text-center" style="margin-bottom: 2.5rem;">
                <a href="index.html" class="nav-brand" style="justify-content: center; margin-bottom: 2rem; gap: 1rem;">
                    <img src="logo.png" alt="Skåne Tamil Sangam Logo" style="height: 70px;">
                </a>
                <h1 class="text-primary" style="font-size: 2.2rem; margin-bottom: 0.5rem; letter-spacing: -0.5px;">
                    New Password</h1>
                <p class="text-muted" style="font-size: 1.05rem;">Choose a strong password to secure your account.</p>
            </div>

            <form id="reset-form">
                <div class="form-group">
                    <label class="form-label">New Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; font-size: 1.1rem; padding: 1.15rem; margin-top: 1rem;" id="submit-btn">Reset
                    Password</button>
            </form>

            <div id="status-msg"></div>

            <div class="text-center"
                style="margin-top: 2.5rem; font-size: 1rem; border-top: 1px solid var(--border); padding-top: 2rem;">
                <a href="login.html" style="color: var(--primary); font-weight: 800; text-decoration: none;">← Back to
                    Login</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = '/api';
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const statusMsg = document.getElementById('status-msg');
            const btn = document.getElementById('submit-btn');

            if (password !== confirmPassword) {
                statusMsg.className = 'alert alert-error';
                statusMsg.textContent = 'Passwords do not match.';
                return;
            }

            if (!token) {
                statusMsg.className = 'alert alert-error';
                statusMsg.textContent = 'Invalid or missing reset token.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Processing...';
            statusMsg.className = '';
            statusMsg.textContent = '';

            try {
                const response = await fetch(`${API_BASE_URL}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok) {
                    statusMsg.className = 'alert alert-success';
                    statusMsg.textContent = '✓ Password reset successful! You can now log in.';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    statusMsg.className = 'alert alert-error';
                    statusMsg.textContent = data.error || data.message;
                }
            } catch (err) {
                statusMsg.className = 'alert alert-error';
                statusMsg.textContent = "Something went wrong. Please try again.";
            } finally {
                btn.disabled = false;
                btn.textContent = 'Reset Password';
            }
        });
    </script>
</body>

</html>
