<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali Sweet Boxes | Skåne Tamil Sangam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(170deg,#003d80,#0056b3 60%,#0b75d1);color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px}
header{text-align:center;margin-bottom:16px}
header b{display:block;font-size:1.3rem}
header span{color:#ffd76a;font-weight:600}
.pass{width:min(380px,100%);background:#fff;color:#1c1c1e;border-radius:22px;padding:22px 20px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.pass h1{margin:0 0 4px;font-size:1.35rem;color:#003d80}
.pass .who{margin:0 0 14px;color:#57534e}
.boxes{display:inline-block;background:#fff4dc;color:#7c2d12;border:1px solid #f6c77a;border-radius:14px;padding:10px 16px;font-weight:800;font-size:1.15rem;margin-bottom:16px}
#qr{display:flex;justify-content:center;padding:10px;border:1px solid #eee;border-radius:16px}
#qr img,#qr canvas{width:min(260px,70vw)!important;height:auto!important}
.code{margin-top:8px;color:#888;font-size:.85rem;letter-spacing:.04em}
.how{margin:16px 0 0;font-weight:600;line-height:1.45}
.state{margin-top:16px;border-radius:14px;padding:14px;font-weight:800;line-height:1.4}
.state.used{background:#fee2e2;color:#991b1b}
.state.bad{background:#fee2e2;color:#991b1b}
.state.warn{background:#fff7ed;color:#9a3412;font-weight:600}
.used #qr{opacity:.25}
footer{margin-top:18px;text-align:center;opacity:.9;font-size:.9rem;line-height:1.5}
footer a{color:#ffd76a}
</style>
</head>
<body>
<header><b>🪔 Diwali 2026</b><span>Skåne Tamil Sangam</span></header>
<div class="pass" id="pass"><p>Loading your QR code…</p></div>
<footer>📅 Sun 15 Nov · 10:00 AM · Tryckeriet<br><a href="/">skanetamilsangam.duckdns.org</a></footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const box = document.getElementById('pass');
const code = new URLSearchParams(location.search).get('pass') || '';

(async () => {
  try {
    const r = await fetch(`/food-api/event/sweets-pass/${encodeURIComponent(code)}`, { cache: 'no-store' });
    const p = await r.json().catch(() => ({}));
    if (!r.ok) { box.innerHTML = `<div class="state bad">${esc(p.error || 'This QR code could not be found.')}</div>`; return; }
    const boxes = `${p.boxes} sweet box${p.boxes === 1 ? '' : 'es'}`;
    let state = '';
    if (p.cancelled) state = '<div class="state bad">This registration was cancelled, so this QR code can\'t be used.</div>';
    else if (p.collected) {
      box.classList.add('used');
      state = `<div class="state used">✓ Already collected<br><span style="font-weight:600">${p.collected.boxes} box${p.collected.boxes === 1 ? '' : 'es'} on ${esc(new Date(p.collected.at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }))}</span></div>`;
    } else if (!p.open) state = `<div class="state warn">🕒 Sweet box distribution starts at <b>${esc(new Date(p.startsAt).toLocaleString('en-GB', { timeZone: 'Europe/Stockholm', hour: 'numeric', minute: '2-digit', hour12: true }).toUpperCase())}</b> on ${esc(new Date(p.startsAt).toLocaleString('en-GB', { timeZone: 'Europe/Stockholm', weekday: 'long', day: 'numeric', month: 'short' }))}. Until then this QR code won't work, so please keep it safe.${p.paid ? '' : `<br><br>Your registration payment is still pending${p.amountDue ? ` (${p.amountDue} kr)` : ''}. Please pay before the event.`}</div>`;
    else if (!p.paid) state = `<div class="state warn">Your registration payment is still pending${p.amountDue ? ` (${p.amountDue} kr)` : ''}. Please pay before the event so the counter can give you your sweet boxes.</div>`;
    box.innerHTML = `<h1>🎁 Diwali sweet boxes</h1>
      <p class="who">${esc(p.name)} · Registration #${p.id}</p>
      <div class="boxes">${esc(boxes)} <span style="font-weight:600">(one per adult)</span></div>
      <div id="qr"></div>
      <div class="code">${esc(code)}</div>
      <p class="how">Show this QR code at the sweets counter to collect your sweet boxes. It can be used once.</p>
      ${state}`;
    if (typeof QRCode !== 'undefined') new QRCode(document.getElementById('qr'), { text: location.href, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    else document.getElementById('qr').textContent = 'Show the code below at the counter.';
  } catch (e) {
    box.innerHTML = '<div class="state bad">Could not load your QR code. Please check your internet connection and try again.</div>';
  }
})();
</script>
</body>
</html>
