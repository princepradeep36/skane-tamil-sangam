<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali QR Code | Skåne Tamil Sangam</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(170deg,#003d80,#0056b3 60%,#0b75d1);color:#fff;display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px}
header{text-align:center;margin-bottom:16px}
header b{display:block;font-size:1.3rem}
header span{color:#ffd76a;font-weight:600}
.pass{width:min(380px,100%);background:#fff;color:#1c1c1e;border-radius:22px;padding:22px 20px;text-align:center;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.pass h1{margin:0 0 4px;font-size:1.35rem;color:#003d80}
.pass .who{margin:0 0 14px;color:#57534e}
.boxes{display:inline-block;background:#fff4dc;color:#7c2d12;border:1px solid #f6c77a;border-radius:14px;padding:10px 16px;font-weight:800;font-size:1.15rem;margin-bottom:16px}
#qr{display:flex;justify-content:center;padding:10px;border:1px solid #eee;border-radius:16px}
#qr img,#qr canvas{width:min(260px,70vw)!important;height:auto!important}
.code{margin-top:8px;color:#888;font-size:.85rem;letter-spacing:.04em}
.how{margin:16px 0 0;font-weight:600;line-height:1.45}
.state{margin-top:16px;border-radius:14px;padding:14px;font-weight:800;line-height:1.4}
.state.used{background:#fee2e2;color:#991b1b}
.state.bad{background:#fee2e2;color:#991b1b}
.state.warn{background:#fff7ed;color:#9a3412;font-weight:600}
.used #qr{opacity:.25}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 16px}
.people div{background:#f1f5f9;border-radius:10px;padding:8px 2px}
.people b{display:block;font-size:1.4rem;color:#003d80;line-height:1.1}
.people span{font-size:.7rem;font-weight:700;color:#475569}
.steps{list-style:none;margin:16px 0 0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:#f8fafc;border-radius:12px;padding:10px 12px;line-height:1.4}
.steps li>b{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#ffc107;color:#3d2c06;display:flex;align-items:center;justify-content:center}
.steps li.done{background:#dcfce7}
.steps li.done>b{background:#16a34a;color:#fff}
.mandatory{margin:12px 0 0;background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 12px;font-weight:700;line-height:1.4;text-align:left}
.steps small{display:block;color:#166534;font-weight:700}
footer{margin-top:18px;text-align:center;opacity:.9;font-size:.9rem;line-height:1.5}
footer a{color:#ffd76a}
</style>
</head>
<body>
<header><b>🪔 Diwali 2026</b><span>Skåne Tamil Sangam</span></header>
<div class="pass" id="pass"><p>Loading your QR code…</p></div>
<footer>📅 Sun 15 Nov · 10:00 AM · Tryckeriet<br><a href="/">skanetamilsangam.duckdns.org</a></footer>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const box = document.getElementById('pass');
const code = new URLSearchParams(location.search).get('pass') || '';

(async () => {
  try {
    const r = await fetch(`/food-api/event/sweets-pass/${encodeURIComponent(code)}`, { cache: 'no-store' });
    const p = await r.json().catch(() => ({}));
    if (!r.ok) { box.innerHTML = `<div class="state bad">${esc(p.error || 'This QR code could not be found.')}</div>`; return; }
    const boxes = `${p.boxes} sweet box${p.boxes === 1 ? '' : 'es'}`;
    const at = d => esc(new Date(d).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' }));
    const startTime = esc(new Date(p.startsAt).toLocaleString('en-GB', { timeZone: 'Europe/Stockholm', hour: 'numeric', minute: '2-digit', hour12: true }).toUpperCase());
    const startDay = esc(new Date(p.startsAt).toLocaleString('en-GB', { timeZone: 'Europe/Stockholm', weekday: 'long', day: 'numeric', month: 'short' }));
    const unpaid = p.paid ? '' : `Your registration payment is still pending${p.amountDue ? ` (${p.amountDue} kr)` : ''}. Please pay before the event.`;
    let state = '';
    if (p.cancelled) state = '<div class="state bad">This registration was cancelled, so this QR code can\'t be used.</div>';
    else if (p.collected) {
      box.classList.add('used');
      state = `<div class="state used">✓ Sweet boxes already collected<br><span style="font-weight:600">${p.collected.boxes} box${p.collected.boxes === 1 ? '' : 'es'} on ${at(p.collected.at)}</span></div>`;
    } else if (!p.open) state = `<div class="state warn">🕒 Sweet box distribution starts at <b>${startTime}</b> on ${startDay}. Until then this QR code won't work for sweets, so please keep it safe.${unpaid ? `<br><br>${unpaid}` : ''}</div>`;
    else if (unpaid) state = `<div class="state warn">${unpaid}</div>`;
    box.innerHTML = `<h1>🎟️ Your Diwali QR code</h1>
      <p class="who">${esc(p.name)} · Registration #${p.id}</p>
      <div class="people">
        <div><b>${p.adults}</b><span>Adults</span></div><div><b>${p.kids612}</b><span>Kids 6–12</span></div>
        <div><b>${p.kidsUnder6}</b><span>Kids under 6</span></div><div><b>${p.people}</b><span>Total</span></div>
      </div>
      <div id="qr"></div>
      <div class="code">${esc(code)}</div>
      <ol class="steps">
        <li class="${p.checkedIn ? 'done' : ''}"><b>1</b><div><strong>At the entrance:</strong> show this QR code to check in.${p.checkedIn ? `<small>✓ Checked in ${at(p.checkedIn.at)}</small>` : ''}</div></li>
        <li class="${p.collected ? 'done' : ''}"><b>2</b><div><strong>At the sweets counter:</strong> show it again to collect <strong>${esc(boxes)}</strong> (one per adult).${p.collected ? '<small>✓ Collected</small>' : ''}</div></li>
      </ol>
      ${p.checkedIn || p.cancelled ? '' : '<p class="mandatory">⚠️ Entrance check-in is mandatory. If you skip it, your QR code will not work at the sweets counter.</p>'}
      ${state}`;
    if (typeof QRCode !== 'undefined') new QRCode(document.getElementById('qr'), { text: location.href, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
    else document.getElementById('qr').textContent = 'Show the code below at the counter.';
  } catch (e) {
    box.innerHTML = '<div class="state bad">Could not load your QR code. Please check your internet connection and try again.</div>';
  }
})();
</script>
</body>
</html>
