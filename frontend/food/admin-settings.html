<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Controls</title><style>body{font-family:Arial;background:#f4f7f9;margin:0;padding:20px;color:#222}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border-radius:14px;padding:6px 20px;box-shadow:0 3px 12px #0001}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.row h3{margin:0 0 4px;font-size:1.05rem}.row p{margin:0;color:#667085;font-size:.9rem}.state{font-size:.8rem;font-weight:700;margin-top:6px}.on{color:#166534}.off{color:#991b1b}a.btn{border:0;border-radius:8px;padding:9px 12px;text-decoration:none;background:#476cff;color:white}.switch{position:relative;display:inline-block;width:56px;height:30px;flex-shrink:0}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;cursor:pointer;inset:0;background:#d0d5dd;border-radius:30px;transition:.2s}.slider:before{content:"";position:absolute;height:24px;width:24px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s;box-shadow:0 1px 3px #0003}.switch input:checked+.slider{background:#16a34a}.switch input:checked+.slider:before{transform:translateX(26px)}.switch input:disabled+.slider{opacity:.6;cursor:wait}.msg{margin:12px 0;color:#667085;min-height:1.2em}</style><link rel="stylesheet" href="../responsive.css">
</head><body><div class="wrap"><div class="top"><div><h1>Site Controls</h1><p>Turn event registration, food ordering and vendor menu editing on or off.</p></div><div><a class="btn" href="admin.html?admin=true">Admin Home</a></div></div><div class="card" id="settings"></div><div class="msg" id="msg">Loading...</div></div><script src="auth.js"></script><script>checkAuth('admin');
const API='/food-api';
const SETTINGS=[
{key:'event_registration_enabled',title:'Event registration',desc:'Shows the "Register" button on the Events page and accepts new registrations and changes. When off, the registration page shows "Registration is closed".',on:'Open',off:'Closed'},
{key:'food_ordering_enabled',title:'Click2Eat food ordering',desc:'Shows the Click2Eat link on the Events page and accepts new food orders. When off, customers can still pay pending orders and view receipts.',on:'Open',off:'Closed'},
{key:'vendor_menu_edit_enabled',title:'Vendors can add or remove menu items',desc:'When off, vendors can only view their menu. Admins can still change menus from Stall & Menu Admin.',on:'Allowed',off:'Not allowed'}
];
let current={};
function render(){document.getElementById('settings').innerHTML=SETTINGS.map(s=>`<div class="row"><div><h3>${s.title}</h3><p>${s.desc}</p><div class="state ${current[s.key]?'on':'off'}">${current[s.key]?s.on:s.off}</div></div><label class="switch"><input type="checkbox" id="${s.key}" ${current[s.key]?'checked':''} onchange="save('${s.key}',this)"><span class="slider"></span></label></div>`).join('')}
async function load(){try{const r=await fetch(API+'/settings',{cache:'no-store'});if(!r.ok)throw new Error();current=await r.json();render();document.getElementById('msg').textContent=''}catch(e){document.getElementById('msg').textContent='Could not load settings. Please refresh in a minute.'}}
async function save(key,el){el.disabled=true;const msg=document.getElementById('msg');msg.textContent='Saving...';try{const r=await authFetch(API+'/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({[key]:el.checked})});if(!r.ok)throw new Error();current=await r.json();render();msg.textContent='Saved.'}catch(e){el.checked=!el.checked;el.disabled=false;msg.textContent='Could not save. Please try again.'}}
load();
</script></body></html>
