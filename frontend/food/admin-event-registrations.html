<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registrations</title><style>body{font-family:Arial;background:#f4f7f9;margin:0;padding:20px;color:#222}.wrap{max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001;overflow:auto}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.filters input,.filters select{padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}.filters input{min-width:240px;flex:1}.table-scroll{max-height:calc(100vh - 260px);min-height:320px;overflow:auto}.count{margin:0 0 12px;color:#667085}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{background:#f8fafc;position:sticky;top:0;z-index:1}button,a.btn{border:0;border-radius:8px;padding:9px 12px;text-decoration:none;cursor:pointer}.paid{background:#dcfce7;color:#166534}.pending{background:#fff7ed;color:#9a3412}.back{background:#476cff;color:white}.export{background:#16a34a;color:white;font-size:16px}.yes{font-weight:700;color:#166534}.cancelled{opacity:.58;background:#f8fafc}.proof-link{display:block;margin-top:6px;padding:0;background:none;color:#1d4ed8;text-decoration:underline;font-size:13px;white-space:nowrap}.no-proof{display:block;margin-top:6px;color:#98a2b3;font-size:12px;white-space:nowrap}.proof-modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.proof-box{background:#fff;border-radius:12px;padding:14px;max-width:min(92vw,560px);max-height:92vh;overflow:auto;text-align:center}.proof-box img{max-width:100%;max-height:72vh;border-radius:8px;border:1px solid #eee}.proof-box .close{background:#476cff;color:#fff;margin-top:10px}.cancelled-badge{background:#fee2e2;color:#991b1b;padding:5px 8px;border-radius:999px;font-weight:700}.edit-overlay{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}.edit-box{background:#fff;border-radius:14px;padding:20px;width:min(640px,100%);box-shadow:0 20px 50px #0004}.edit-box h2{margin:0 0 4px}.edit-box .sub{color:#667085;margin:0 0 14px;font-size:.9rem}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.edit-grid label{display:flex;flex-direction:column;gap:4px;font-weight:bold;font-size:.85rem}.edit-grid input,.edit-grid select,.edit-grid textarea{padding:9px 10px;border:1px solid #d0d5dd;border-radius:8px;font:inherit;font-size:14px;font-weight:normal}.edit-grid .full{grid-column:1/-1}.edit-note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:.85rem;margin-top:12px}.edit-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}.edit-actions .save{background:#16a34a;color:#fff}.edit-actions .close{background:#eef2f7}@media(max-width:600px){.edit-grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="../responsive.css?v=20261015">
</head><body><div class="wrap"><div class="top"><div><h1>Event Registrations</h1><p>Diwali Celebration 2026 family registrations.</p></div><div><a class="btn back" href="admin.html?admin=true">Admin Home</a> <a class="btn back" href="admin-event-summary.html?admin=true">Registration Summary</a> <button class="btn export" id="exportBtn">Export to Excel</button></div></div><div class="card"><div class="filters"><input id="search" type="search" placeholder="Search name, phone, WhatsApp or email"><select id="volunteerFilter"><option value="ALL">All registrations</option><option value="YES">Volunteers only</option><option value="NO">Non-volunteers only</option></select><select id="culturalFilter"><option value="ALL">All cultural choices</option><option value="ANY">Cultural activities (any)</option><option value="GROUP_DANCE">Group Dance only</option><option value="GROUP_SINGING">Group Singing only</option><option value="NONE">No cultural activity</option></select><select id="statusFilter"><option value="ALL">Active + cancelled</option><option value="ACTIVE">Active only</option><option value="CANCELLED">Cancelled only</option></select><select id="paymentFilter"><option value="ALL">All payment statuses</option><option value="PAID">Paid only</option><option value="PENDING">Unpaid / Pending only</option></select></div><div class="count" id="resultCount"></div><div class="table-scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>WhatsApp</th><th>Adults</th><th>Kids 6–12</th><th>Kids &lt;6</th><th>Total</th><th>Amount (kr)</th><th>Assigned Swish</th><th>Volunteer</th><th>Cultural</th><th>Activity</th><th>Comments</th><th>Payment</th><th>Registered</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="auth.js"></script><script>checkAuth('admin');const API='/food-api';let registrations=[];let filtered=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('search').value.trim().toLowerCase();const vf=document.getElementById('volunteerFilter').value;const cf=document.getElementById('culturalFilter').value;const sf=document.getElementById('statusFilter').value;const pf=document.getElementById('paymentFilter').value;const d=registrations.filter(x=>{const hay=[x.first_name,x.last_name,x.email,x.phone,x.whatsapp].join(' ').toLowerCase();const status=x.registration_status||'ACTIVE';return(!q||hay.includes(q))&&(vf==='ALL'||(vf==='YES')===x.volunteer_interest)&&(cf==='ALL'||(cf==='ANY'&&x.cultural_interest)||(cf==='NONE'&&!x.cultural_interest)||(x.cultural_interest&&x.cultural_activity_type===cf))&&(sf==='ALL'||status===sf)&&(pf==='ALL'||x.payment_status===pf)});filtered=d;document.getElementById('resultCount').textContent=`Showing ${d.length} of ${registrations.length} registrations`;document.getElementById('rows').innerHTML=d.map(x=>`<tr class="${(x.registration_status||'ACTIVE')==='CANCELLED'?'cancelled':''}"><td>${x.id}</td><td>${esc(x.first_name)} ${esc(x.last_name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.whatsapp)}</td><td>${x.adults_count}</td><td>${x.kids_6_12_count}</td><td>${x.kids_below_6_count}</td><td><b>${x.total_participants}</b></td><td><b>${x.total_amount} kr</b></td><td>${esc(x.swish_number||'Not assigned')}</td><td class="${x.volunteer_interest?'yes':''}">${x.volunteer_interest?'Yes':'No'}</td><td>${x.cultural_interest?'Yes':'No'}</td><td>${x.cultural_interest?esc((x.cultural_activity_type||'').replace('GROUP_DANCE','Group Dance').replace('GROUP_SINGING','Group Singing')):'-'}</td><td style="white-space:normal;min-width:180px;max-width:280px">${esc(x.comments||'-')}</td><td>${(x.registration_status||'ACTIVE')==='CANCELLED'?'<span class="cancelled-badge">CANCELLED</span>':`<button class="${x.payment_status==='PAID'?'paid':'pending'}" onclick="togglePay(${x.id},'${x.payment_status}')">${x.payment_status}</button>${x.payment_proof_uploaded_at?`<button class="proof-link" onclick="viewProof(${x.id})">Click here to view payment</button>`:'<span class="no-proof">No screenshot</span>'}`}</td><td>${new Date(x.created_at).toLocaleString()}</td><td style="white-space:nowrap">${(x.registration_status||'ACTIVE')==='CANCELLED'?'<span class="cancelled-badge">Cancelled</span>':`<button style="background:#e0e7ff;color:#3730a3;font-weight:700" onclick="openEdit(${x.id})">Edit</button> <button style="background:#fee2e2;color:#991b1b;font-weight:700" onclick="cancelRegistration(${x.id})">Cancel</button>`}</td></tr>`).join('')||'<tr><td colspan="19">No registrations match the selected filters.</td></tr>';}async function load(){const r=await authFetch(API+'/admin/event-registrations',{cache:'no-store'});registrations=await r.json();render()}async function togglePay(id,s){const r=await authFetch(`${API}/admin/event-registration/${id}/payment`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s==='PAID'?'PENDING':'PAID'})});if(!r.ok){alert('Could not update payment status');return;}await load();}async function viewProof(id){const x=registrations.find(r=>r.id===id);const r=await authFetch(`${API}/admin/event-registration/${id}/payment-proof`,{cache:'no-store'});if(!r.ok){alert('Could not load the payment screenshot.');return;}const url=URL.createObjectURL(await r.blob());const m=document.createElement('div');m.className='proof-modal';m.innerHTML=`<div class="proof-box"><h3 style="margin:0 0 4px">Payment screenshot</h3><p style="margin:0 0 10px;color:#667085">#${id} ${esc(x?.first_name)} ${esc(x?.last_name)} · ${x?.total_amount} kr · uploaded ${x?.payment_proof_uploaded_at?new Date(x.payment_proof_uploaded_at).toLocaleString():''}</p><img alt="Payment screenshot"><br><a class="btn" style="color:#1d4ed8" target="_blank">Open full size</a> <button class="close">Close</button></div>`;m.querySelector('img').src=url;m.querySelector('a').href=url;const close=()=>{m.remove();URL.revokeObjectURL(url)};m.addEventListener('click',e=>{if(e.target===m)close()});m.querySelector('.close').onclick=close;document.body.append(m)}function openEdit(id){const x=registrations.find(r=>r.id===id);if(!x)return;document.querySelector('.edit-overlay')?.remove();const o=document.createElement('div');o.className='edit-overlay';const v=s=>esc(s??'');o.innerHTML=`<form class="edit-box" id="editForm"><h2>Edit registration #${x.id}</h2><p class="sub">Phone and WhatsApp need the country code, e.g. +46701234567.</p><div class="edit-grid">
<label>First name<input name="firstName" required value="${v(x.first_name)}"></label><label>Last name<input name="lastName" required value="${v(x.last_name)}"></label>
<label class="full">Email<input name="email" type="email" required value="${v(x.email)}"></label>
<label>Phone<input name="phone" required value="${v(x.phone)}"></label><label>WhatsApp<input name="whatsapp" required value="${v(x.whatsapp)}"></label>
<label>Adults<input name="adultsCount" type="number" min="0" max="20" required value="${Number(x.adults_count)}"></label><label>Kids 6–12<input name="kids6to12Count" type="number" min="0" max="20" required value="${Number(x.kids_6_12_count)}"></label>
<label>Kids under 6<input name="kidsBelow6Count" type="number" min="0" max="20" required value="${Number(x.kids_below_6_count)}"></label><label>Volunteer<select name="volunteerInterest"><option value="false">No</option><option value="true" ${x.volunteer_interest?'selected':''}>Yes</option></select></label>
<label>Cultural activity<select name="culturalActivityType"><option value="">None</option><option value="GROUP_DANCE" ${x.cultural_interest&&x.cultural_activity_type==='GROUP_DANCE'?'selected':''}>Group Dance</option><option value="GROUP_SINGING" ${x.cultural_interest&&x.cultural_activity_type==='GROUP_SINGING'?'selected':''}>Group Singing</option></select></label>
<label class="full">Comments<textarea name="comments" rows="2" maxlength="1000">${v(x.comments)}</textarea></label></div>
<div class="edit-note">Changing the number of adults or kids 6–12 changes the fee. If the new fee is more than what was already paid, the registration goes back to PENDING and the family is asked to pay only the difference.</div>
<div class="edit-actions"><button type="button" class="close">Close</button><button type="submit" class="save">Save changes</button></div></form>`;
document.body.append(o);o.querySelector('.close').onclick=()=>o.remove();o.addEventListener('click',e=>{if(e.target===o)o.remove()});
o.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const activity=f.get('culturalActivityType');const body={firstName:f.get('firstName').trim(),lastName:f.get('lastName').trim(),email:f.get('email').trim(),phone:f.get('phone').trim(),whatsapp:f.get('whatsapp').trim(),adultsCount:Number(f.get('adultsCount')),kids6to12Count:Number(f.get('kids6to12Count')),kidsBelow6Count:Number(f.get('kidsBelow6Count')),volunteerInterest:f.get('volunteerInterest')==='true',culturalInterest:!!activity,culturalActivityType:activity||null,comments:f.get('comments')};
const btn=o.querySelector('.save');btn.disabled=true;btn.textContent='Saving…';const r=await authFetch(`${API}/admin/event-registration/${x.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));
if(!r.ok){alert(d.error||'Could not save the changes.');btn.disabled=false;btn.textContent='Save changes';return;}o.remove();await load();}}
async function cancelRegistration(id){if(!confirm('Cancel this registration? It will be removed from all active registration and payment summary totals.'))return;const r=await authFetch(`${API}/admin/event-registration/${id}`,{method:'DELETE'});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Could not cancel registration');return;}await load();}['search','volunteerFilter','culturalFilter','statusFilter','paymentFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));function exportExcel(){if(!filtered.length){alert('No registrations to export.');return}const activity={GROUP_DANCE:'Group Dance',GROUP_SINGING:'Group Singing'};const rows=filtered.map(x=>({'ID':x.id,'First Name':x.first_name,'Last Name':x.last_name,'Email':x.email,'Phone':x.phone,'WhatsApp':x.whatsapp,'Adults':x.adults_count,'Kids 6-12':x.kids_6_12_count,'Kids <6':x.kids_below_6_count,'Total':Number(x.total_participants),'Amount (kr)':Number(x.total_amount),'Assigned Swish':x.swish_number||'Not assigned','Volunteer':x.volunteer_interest?'Yes':'No','Cultural':x.cultural_interest?'Yes':'No','Activity':x.cultural_interest?(activity[x.cultural_activity_type]||''):'','Comments':x.comments||'','Payment':x.payment_status,'Payment Screenshot':x.payment_proof_uploaded_at?'Yes':'No','Status':x.registration_status||'ACTIVE','Registered':new Date(x.created_at).toLocaleString()}));const ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(40,Math.max(k.length,...rows.map(r=>String(r[k]??'').length))+2)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registrations');XLSX.writeFile(wb,`event-registrations-${new Date().toISOString().slice(0,10)}.xlsx`)}document.getElementById('exportBtn').addEventListener('click',exportExcel);load();</script></body></html>
