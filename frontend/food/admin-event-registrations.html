<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Registrations</title><style>body{font-family:Arial;background:#f4f7f9;margin:0;padding:20px;color:#222}.wrap{max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px #0001;overflow:auto}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.filters input,.filters select{padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px;font-size:14px}.filters input{min-width:240px;flex:1}.table-scroll{max-height:calc(100vh - 260px);min-height:320px;overflow:auto}.count{margin:0 0 12px;color:#667085}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left}th{background:#f8fafc;position:sticky;top:0;z-index:1}button,a.btn{border:0;border-radius:8px;padding:9px 12px;text-decoration:none;cursor:pointer}.paid{background:#dcfce7;color:#166534}.pending{background:#fff7ed;color:#9a3412}.back{background:#476cff;color:white}.yes{font-weight:700;color:#166534}.cancelled{opacity:.58;background:#f8fafc}.cancelled-badge{background:#fee2e2;color:#991b1b;padding:5px 8px;border-radius:999px;font-weight:700}</style><link rel="stylesheet" href="../responsive.css">
</head><body><div class="wrap"><div class="top"><div><h1>Event Registrations</h1><p>Diwali Celebration 2026 family registrations.</p></div><div><a class="btn back" href="admin.html?admin=true">Admin Home</a> <a class="btn back" href="admin-event-summary.html?admin=true">Registration Summary</a></div></div><div class="card"><div class="filters"><input id="search" type="search" placeholder="Search name, phone, WhatsApp or email"><select id="volunteerFilter"><option value="ALL">All registrations</option><option value="YES">Volunteers only</option><option value="NO">Non-volunteers only</option></select><select id="culturalFilter"><option value="ALL">All cultural choices</option><option value="ANY">Cultural activities (any)</option><option value="GROUP_DANCE">Group Dance only</option><option value="GROUP_SINGING">Group Singing only</option><option value="NONE">No cultural activity</option></select><select id="statusFilter"><option value="ALL">Active + cancelled</option><option value="ACTIVE">Active only</option><option value="CANCELLED">Cancelled only</option></select><select id="paymentFilter"><option value="ALL">All payment statuses</option><option value="PAID">Paid only</option><option value="PENDING">Unpaid / Pending only</option></select></div><div class="count" id="resultCount"></div><div class="table-scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>WhatsApp</th><th>Adults</th><th>Kids 6–12</th><th>Kids &lt;6</th><th>Total</th><th>Amount (kr)</th><th>Assigned Swish</th><th>Volunteer</th><th>Cultural</th><th>Activity</th><th>Comments</th><th>Payment</th><th>Registered</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></div><script src="auth.js"></script><script>checkAuth('admin');const API='/food-api';let registrations=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=document.getElementById('search').value.trim().toLowerCase();const vf=document.getElementById('volunteerFilter').value;const cf=document.getElementById('culturalFilter').value;const sf=document.getElementById('statusFilter').value;const pf=document.getElementById('paymentFilter').value;const d=registrations.filter(x=>{const hay=[x.first_name,x.last_name,x.email,x.phone,x.whatsapp].join(' ').toLowerCase();const status=x.registration_status||'ACTIVE';return(!q||hay.includes(q))&&(vf==='ALL'||(vf==='YES')===x.volunteer_interest)&&(cf==='ALL'||(cf==='ANY'&&x.cultural_interest)||(cf==='NONE'&&!x.cultural_interest)||(x.cultural_interest&&x.cultural_activity_type===cf))&&(sf==='ALL'||status===sf)&&(pf==='ALL'||x.payment_status===pf)});document.getElementById('resultCount').textContent=`Showing ${d.length} of ${registrations.length} registrations`;document.getElementById('rows').innerHTML=d.map(x=>`<tr class="${(x.registration_status||'ACTIVE')==='CANCELLED'?'cancelled':''}"><td>${x.id}</td><td>${esc(x.first_name)} ${esc(x.last_name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.whatsapp)}</td><td>${x.adults_count}</td><td>${x.kids_6_12_count}</td><td>${x.kids_below_6_count}</td><td><b>${x.total_participants}</b></td><td><b>${x.total_amount} kr</b></td><td>${esc(x.swish_number||'Not assigned')}</td><td class="${x.volunteer_interest?'yes':''}">${x.volunteer_interest?'Yes':'No'}</td><td>${x.cultural_interest?'Yes':'No'}</td><td>${x.cultural_interest?esc((x.cultural_activity_type||'').replace('GROUP_DANCE','Group Dance').replace('GROUP_SINGING','Group Singing')):'-'}</td><td style="white-space:normal;min-width:180px;max-width:280px">${esc(x.comments||'-')}</td><td>${(x.registration_status||'ACTIVE')==='CANCELLED'?'<span class="cancelled-badge">CANCELLED</span>':`<button class="${x.payment_status==='PAID'?'paid':'pending'}" onclick="togglePay(${x.id},'${x.payment_status}')">${x.payment_status}</button>`}</td><td>${new Date(x.created_at).toLocaleString()}</td><td>${(x.registration_status||'ACTIVE')==='CANCELLED'?'<span class="cancelled-badge">Cancelled</span>':`<button style="background:#fee2e2;color:#991b1b;font-weight:700" onclick="cancelRegistration(${x.id})">Cancel</button>`}</td></tr>`).join('')||'<tr><td colspan="19">No registrations match the selected filters.</td></tr>';}async function load(){const r=await authFetch(API+'/admin/event-registrations',{cache:'no-store'});registrations=await r.json();render()}async function togglePay(id,s){const r=await authFetch(`${API}/admin/event-registration/${id}/payment`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:s==='PAID'?'PENDING':'PAID'})});if(!r.ok){alert('Could not update payment status');return;}await load();}async function cancelRegistration(id){if(!confirm('Cancel this registration? It will be removed from all active registration and payment summary totals.'))return;const r=await authFetch(`${API}/admin/event-registration/${id}`,{method:'DELETE'});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'Could not cancel registration');return;}await load();}['search','volunteerFilter','culturalFilter','statusFilter','paymentFilter'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',render));load();</script></body></html>
