<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diwali QR Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f7f9;color:#1c1c1e}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:1.4rem}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 14px;font-weight:700;text-decoration:none;cursor:pointer;font-size:.95rem}
.back{background:#476cff;color:#fff}
.modes{display:flex;gap:6px;background:#e9eef5;padding:5px;border-radius:14px;margin-top:14px}
.modes button{flex:1;border:0;background:transparent;padding:12px 8px;border-radius:10px;font-size:1rem;font-weight:800;color:#555;cursor:pointer}
.modes button.active{background:#fff;color:#0056b3;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.modes button.active.sweets{color:#c2410c}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px #0001}
.stat b{display:block;font-size:1.5rem}
.stat span{color:#667085;font-size:.85rem}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px #0001;margin-bottom:14px}
#reader{width:100%;border-radius:12px;overflow:hidden;background:#111;min-height:60px}
#reader video{border-radius:12px}
.cam-actions{display:flex;gap:8px;margin-top:10px}
.cam-actions .btn{flex:1}
.start{background:#16a34a;color:#fff}
.stop{background:#eef2f7;color:#333}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
.manual .btn{background:#0f172a;color:#fff}
.hint{color:#667085;font-size:.85rem;margin:6px 0 0}
.result{border-radius:18px;padding:20px 16px;text-align:center;margin-bottom:14px}
.result .big{font-size:2.6rem;font-weight:900;line-height:1.1;margin:6px 0}
.result .who{font-size:1.15rem;font-weight:700}
.result .sub{margin-top:6px;font-weight:600;opacity:.9}
.result .btn{margin-top:14px;width:100%;font-size:1.05rem;padding:14px}
.result ul{text-align:left;margin:10px 0 0;padding-left:20px;font-weight:600}
.people{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.people div{background:rgba(255,255,255,.92);color:#1c1c1e;border-radius:10px;padding:8px 4px}
.people b{display:block;font-size:1.7rem;line-height:1.1}
.people span{font-size:.72rem;font-weight:700;color:#475569}
.people div.total{background:#1c1c1e;color:#fff}
.people div.total span{color:#cbd5e1}
.chip{display:inline-block;margin-top:10px;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;background:rgba(255,255,255,.9);color:#166534}
.chip.due{color:#b42318}
.give{background:#16a34a;color:#fff}
.info{background:#0284c7;color:#fff}
.used{background:#dc2626;color:#fff}
.warn{background:#fff7ed;color:#9a3412;border:2px solid #fdba74}
.warn .people div{background:#fff;border:1px solid #fed7aa}
.bad{background:#fee2e2;color:#991b1b}
.next{background:#fff;color:#111}
.warn .next,.bad .next{background:#0f172a;color:#fff}
.force{background:#ea580c;color:#fff}
.closed-note{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 12px;font-weight:600;margin-bottom:14px}
.logout{background:#dc2626;color:#fff}
.ask{margin-top:12px;background:#fff;border:1px dashed #fdba74;border-radius:10px;padding:10px;font-weight:700}
.users h2{margin:0 0 4px;font-size:1.1rem}
.user-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eef2f7}
.user-row b{flex:1;min-width:0;word-break:break-all}
.user-row button{padding:7px 10px;font-size:.85rem}
.add-user{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:10px}
.add-user input{min-width:0;padding:10px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}
@media(max-width:480px){.add-user{grid-template-columns:1fr}}
.unuse{background:transparent;color:inherit;text-decoration:underline;font-weight:600;padding:8px}
[hidden]{display:none!important}
@media(max-width:380px){.people{grid-template-columns:repeat(2,1fr)}}
</style>
<link rel="stylesheet" href="../responsive.css?v=20261015">
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🎟️ Diwali QR Scanner</h1><a class="btn back" id="homeBtn" href="admin.html?admin=true">Admin Home</a><button class="btn logout" id="logoutBtn" hidden onclick="logout()">Log out</button></div>

  <div class="modes" role="tablist">
    <button type="button" data-mode="checkin" role="tab">🎟️ Entrance check-in</button>
    <button type="button" data-mode="sweets" class="sweets" role="tab">🎁 Sweet boxes</button>
  </div>

  <div class="stats">
    <div class="stat"><b id="sA">–</b><span id="sAl"></span></div>
    <div class="stat"><b id="sB">–</b><span id="sBl"></span></div>
  </div>

  <div class="closed-note" id="closedNote" hidden></div>

  <div id="result" hidden></div>

  <div id="scanArea">
  <div class="card">
    <div id="reader"></div>
    <div class="cam-actions">
      <button class="btn start" id="startBtn">📷 Start scanning</button>
      <button class="btn stop" id="stopBtn" hidden>Stop camera</button>
    </div>
    <p class="hint" id="modeHint"></p>
  </div>

  <div class="card">
    <form class="manual" id="manualForm">
      <input id="manualCode" placeholder="Or type the code, e.g. 12-AbC…" autocomplete="off" autocapitalize="off">
      <button class="btn" type="submit">Check</button>
    </form>
  </div>
  </div>

  <div class="card users" id="usersCard" hidden>
    <h2>👥 Scanner logins</h2>
    <p class="hint">Volunteers with these logins can only use this scanner: entrance check-in and sweet boxes. "Give anyway" and undo stay with admins.</p>
    <div id="userList"></div>
    <form class="add-user" id="addUser">
      <input id="newUser" placeholder="Username, e.g. gate1" autocomplete="off" autocapitalize="off" aria-label="Username" required>
      <input id="newPass" placeholder="Password (8+ characters)" autocomplete="new-password" aria-label="Password" required minlength="8">
      <button class="btn start" type="submit">+ Add</button>
    </form>
  </div>
</div>

<script src="auth.js"></script>
<script>
checkAuth('scanner');
const API = '/food-api';
// Admins can override warnings, undo scans and manage scanner logins; scanner logins can only scan.
const IS_ADMIN = sessionStorage.getItem('user_role') === 'admin';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const when = d => new Date(d).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' });
const plural = n => `${n} box${n === 1 ? '' : 'es'}`;
const openText = d => new Date(d).toLocaleString('en-GB', { timeZone: 'Europe/Stockholm', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

// The same family QR code is scanned twice: at the entrance (check-in) and at the sweets counter.
// Each scanning phone stays in the mode it was last set to.
let mode = new URLSearchParams(location.search).get('mode');
if (!['checkin', 'sweets'].includes(mode)) { try { mode = localStorage.getItem('qrScannerMode'); } catch (e) {} }
if (!['checkin', 'sweets'].includes(mode)) mode = 'checkin';

let scanner = null;
let busy = false; // a result is on screen: ignore the camera until "Scan next"
let lastCode = '';
let cameraWanted = false; // the admin started the camera: reopen it after each result

function setMode(m) {
  mode = m;
  try { localStorage.setItem('qrScannerMode', m); } catch (e) {}
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
  $('modeHint').textContent = m === 'checkin'
    ? 'Entrance: scan the family’s QR code to check in their registration and see how many adults and kids are registered.'
    : 'Sweets counter: scan the same QR code to give one sweet box per adult, once. Families should check in at the entrance first.';
  if (!$('result').hidden) scanNext();
  loadSummary();
}
document.querySelectorAll('.modes button').forEach(b => { b.onclick = () => setMode(b.dataset.mode); });

async function loadSummary() {
  try {
    const r = await authFetch(`${API}/admin/sweets/summary`, { cache: 'no-store' });
    const s = await r.json();
    if (mode === 'checkin') {
      $('sA').textContent = `${s.checked_in_families} / ${s.registrations}`; $('sAl').textContent = 'families checked in';
      $('sB').textContent = `${s.checked_in_people} / ${s.people}`; $('sBl').textContent = 'people checked in';
      $('closedNote').hidden = true;
    } else {
      $('sA').textContent = `${s.collected_boxes} / ${s.boxes}`; $('sAl').textContent = 'boxes given';
      $('sB').textContent = `${s.collected_families} / ${s.families}`; $('sBl').textContent = 'families collected';
      $('closedNote').hidden = s.open;
      if (!s.open) $('closedNote').textContent = `🕒 Sweet boxes open on ${openText(s.opensAt)}. Before that, every scan asks you to confirm "Give anyway".`;
    }
  } catch (e) {}
}

// While a result is shown the camera is closed, so only the result and "Scan next" are on screen.
function showResult(cls, html) {
  $('scanArea').hidden = true;
  stopCamera();
  const el = $('result');
  el.className = `result ${cls}`;
  el.innerHTML = html;
  el.hidden = false;
  el.scrollIntoView({ block: 'start' });
  const next = el.querySelector('.next');
  if (next) next.onclick = scanNext;
}

function scanNext() {
  $('result').hidden = true;
  $('scanArea').hidden = false;
  busy = false;
  lastCode = '';
  $('manualCode').value = '';
  if (cameraWanted) startCamera();
}

const nextBtn = '<button class="btn next">Scan next ›</button>';
const whoLine = d => (d.name ? `<div class="who">${esc(d.name)} · #${d.id}</div>` : '');
const peopleGrid = d => `<div class="people">
    <div><b>${d.adults}</b><span>Adults</span></div>
    <div><b>${d.kids612}</b><span>Kids 6–12</span></div>
    <div><b>${d.kidsUnder6}</b><span>Kids under 6</span></div>
    <div class="total"><b>${d.people}</b><span>Total</span></div>
  </div>`;
const payChip = d => (d.paid ? '<span class="chip">✓ Paid</span>' : `<span class="chip due">⚠ Not paid${d.amountDue ? ` · ${d.amountDue} kr due` : ''}</span>`);

async function check(code, force) {
  busy = true;
  lastCode = code;
  try {
    const url = mode === 'checkin' ? `${API}/admin/checkin/scan` : `${API}/admin/sweets/scan`;
    const r = await authFetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, force: !!force }) });
    const d = await r.json().catch(() => ({}));
    if (mode === 'checkin') showCheckin(d); else showSweets(d, code);
  } catch (e) {
    showResult('bad', `Could not check the code<div class="sub">Check the internet connection and try again.</div><button class="btn next">Try again ›</button>`);
  }
}

function showCheckin(d) {
  if (d.result === 'CHECKED_IN') {
    if (navigator.vibrate) navigator.vibrate(200);
    showResult('give', `✅ Checked in${whoLine(d)}${peopleGrid(d)}${payChip(d)}
      <div class="sub">Sweet boxes: ${plural(d.boxes)} at the sweets counter.</div>${nextBtn}`);
    loadSummary();
  } else if (d.result === 'ALREADY_CHECKED_IN') {
    if (navigator.vibrate) navigator.vibrate([150, 80, 150]);
    showResult('info', `ℹ️ Already checked in${whoLine(d)}
      <div class="sub">Checked in on ${esc(when(d.checkedIn.at))}${d.checkedIn.by ? ` by ${esc(d.checkedIn.by)}` : ''}</div>
      ${peopleGrid(d)}${payChip(d)}${nextBtn}${IS_ADMIN ? `<button class="btn unuse" onclick="undoCheckin(${d.id})">Undo this check-in</button>` : ''}`);
  } else if (d.result === 'CANCELLED') {
    showResult('bad', `⛔ Registration cancelled${whoLine(d)}<div class="sub">This registration was cancelled.</div>${nextBtn}`);
  } else {
    showResult('bad', `❓ Not recognised<div class="sub">${esc(d.error || 'This is not a Diwali QR code from the Sangam.')}</div>${nextBtn}`);
  }
}

// Reasons to stop before giving sweet boxes; the admin can still give them with "Give anyway".
const WARNINGS = {
  NOT_OPEN: d => `Sweet boxes open on ${esc(openText(d.opensAt))}.`,
  NOT_CHECKED_IN: () => 'Not checked in at the entrance yet.',
  NOT_PAID: d => `Registration not paid${d.amountDue ? ` (${d.amountDue} kr due)` : ''}.`
};
const WARNING_TITLES = { NOT_OPEN: '🕒 Not open yet', NOT_CHECKED_IN: '🎟️ Not checked in yet', NOT_PAID: '⚠️ Registration not paid' };

function showSweets(d, code) {
  if (d.result === 'GIVE') {
    if (navigator.vibrate) navigator.vibrate(200);
    showResult('give', `✅ Give<div class="big">${plural(d.boxes)}</div>${whoLine(d)}<div class="sub">Marked as collected.</div>${nextBtn}`);
    loadSummary();
  } else if (d.result === 'ALREADY_USED') {
    if (navigator.vibrate) navigator.vibrate([150, 80, 150, 80, 150]);
    showResult('used', `⛔ Already collected<div class="big">Don't give</div>${whoLine(d)}
      <div class="sub">${plural(d.collected.boxes)} collected on ${esc(when(d.collected.at))}${d.collected.by ? ` by ${esc(d.collected.by)}` : ''}</div>
      ${nextBtn}${IS_ADMIN ? `<button class="btn unuse" onclick="markUnused(${d.id})">Mark the sweet boxes as not collected</button>` : ''}`);
  } else if (WARNINGS[d.result]) {
    showResult('warn', `${WARNING_TITLES[d.result]}<div class="big">${plural(d.boxes)}</div>${whoLine(d)}
      <ul>${(d.warnings || [d.result]).map(w => `<li>${WARNINGS[w](d)}</li>`).join('')}</ul>
      ${IS_ADMIN
        ? `<div class="sub">Give the boxes now only if you have decided to.</div><button class="btn force" id="forceBtn">Give ${plural(d.boxes)} anyway</button>`
        : '<div class="ask">Don’t give the boxes yet. If they should get them anyway, ask an admin to scan this QR code.</div>'}${nextBtn}`);
    if (IS_ADMIN) $('forceBtn').onclick = () => check(code, true);
  } else if (d.result === 'NO_ADULTS') {
    showResult('bad', `No sweet boxes<div class="big">0 adults</div>${whoLine(d)}<div class="sub">This registration has no adults, so there are no boxes to give.</div>${nextBtn}`);
  } else if (d.result === 'CANCELLED') {
    showResult('bad', `⛔ Registration cancelled<div class="big">Don't give</div>${whoLine(d)}${nextBtn}`);
  } else {
    showResult('bad', `❓ Not recognised<div class="sub">${esc(d.error || 'This is not a Diwali QR code from the Sangam.')}</div>${nextBtn}`);
  }
}

async function undoCheckin(id) {
  if (!confirm(`Undo the check-in for registration #${id}? It will show as not checked in.`)) return;
  const r = await authFetch(`${API}/admin/checkin/${id}`, { method: 'DELETE' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) return alert(d.error || 'Could not change it.');
  showResult('give', `↩️ Check-in undone<div class="who" style="margin-top:6px">Registration #${id} is not checked in now.</div>${nextBtn}`);
  loadSummary();
}

async function markUnused(id) {
  if (!confirm(`Mark the sweet boxes for registration #${id} as not collected? The family can then collect their boxes again.`)) return;
  const r = await authFetch(`${API}/admin/sweets/${id}`, { method: 'DELETE' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) return alert(d.error || 'Could not change it.');
  showResult('give', `↩️ Marked as not collected<div class="who" style="margin-top:6px">Registration #${id} can collect again.</div>${nextBtn}`);
  loadSummary();
}

function onScan(text) {
  if (busy || text === lastCode) return;
  check(text);
}

async function startCamera() {
  if (typeof Html5Qrcode === 'undefined') return alert('The scanner could not load. Check the internet connection, or type the code below.');
  scanner = scanner || new Html5Qrcode('reader');
  if (scanner.isScanning) return;
  try {
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } }, onScan, () => {});
    cameraWanted = true;
    $('startBtn').hidden = true;
    $('stopBtn').hidden = false;
    $('scanArea').scrollIntoView({ block: 'start' });
  } catch (e) {
    alert('Could not open the camera. Allow camera access for this site in the browser, then try again.');
  }
}

async function stopCamera() {
  if (scanner && scanner.isScanning) { try { await scanner.stop(); } catch (e) {} }
  $('startBtn').hidden = false;
  $('stopBtn').hidden = true;
}

$('startBtn').onclick = startCamera;
$('stopBtn').onclick = () => { cameraWanted = false; stopCamera(); };
$('manualForm').onsubmit = e => {
  e.preventDefault();
  const code = $('manualCode').value.trim();
  if (code) { busy = false; check(code); }
};

/* ---------- Scanner logins (admins only) ---------- */
async function loadUsers() {
  const r = await authFetch(`${API}/admin/scanner-users`, { cache: 'no-store' });
  const list = await r.json().catch(() => []);
  $('userList').innerHTML = list.map(u => `<div class="user-row"><b>${esc(u.username)}</b>
      <button class="btn stop" onclick="resetPassword(${u.id}, '${esc(u.username)}')">New password</button>
      <button class="btn used" onclick="removeUser(${u.id}, '${esc(u.username)}')">Remove</button></div>`).join('')
    || '<p class="hint">No scanner logins yet. Add one below for each volunteer or scanning phone.</p>';
}
$('addUser').onsubmit = async e => {
  e.preventDefault();
  const r = await authFetch(`${API}/admin/scanner-users`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: $('newUser').value, password: $('newPass').value }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) return alert(d.error || 'Could not add the login.');
  alert(`Login created.

Username: ${$('newUser').value.trim().toLowerCase()}
Password: the one you typed

The volunteer logs in at the staff login page and goes straight to this scanner.`);
  $('newUser').value = ''; $('newPass').value = '';
  loadUsers();
};
async function resetPassword(id, name) {
  const password = prompt(`New password for ${name} (8+ characters):`);
  if (password === null) return;
  const r = await authFetch(`${API}/admin/scanner-users/${id}/password`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
  const d = await r.json().catch(() => ({}));
  alert(r.ok ? `Password changed for ${name}.` : (d.error || 'Could not change the password.'));
}
async function removeUser(id, name) {
  if (!confirm(`Remove the scanner login "${name}"? That volunteer can no longer log in.`)) return;
  const r = await authFetch(`${API}/admin/scanner-users/${id}`, { method: 'DELETE' });
  if (!r.ok) alert((await r.json().catch(() => ({}))).error || 'Could not remove it.');
  loadUsers();
}

if (IS_ADMIN) { $('usersCard').hidden = false; loadUsers(); }
else { $('homeBtn').hidden = true; $('logoutBtn').hidden = false; }

setMode(mode);
</script>
</body>
</html>
