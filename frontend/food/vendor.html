<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click2Eat Vendor Portal</title>
    <style>
        :root {
            --primary: #007bff;
            --bg: #f4f7f9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-decoration: none;
            color: #333;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--primary);
        }

        .desc {
            font-size: 0.9rem;
            color: #666;
        }
    </style>
<link rel="stylesheet" href="../responsive.css">
</head>

<body>
    <button class="logout-btn" onclick="logout()">Logout</button>
    <div class="container">
        <h1>Click2Eat Vendor Portal</h1>

        <div class="grid">
            <a href="#" id="dash-link" class="card">
                <div class="icon">🔔</div>
                <div class="title">Live Vendor Dashboard</div>
                <div class="desc">Real-time incoming orders for display</div>
            </a>

            <a href="#" id="sum-link" class="card">
                <div class="icon">📊</div>
                <div class="title">Sales Summary</div>
                <div class="desc">Total sales report by vendor and item</div>
            </a>
            <a href="#" id="menu-link" class="card">
                <div class="icon">🍔</div>
                <div class="title">Manage Menu</div>
                <div class="desc">Add or remove items from your menu</div>
            </a>
            <a href="#" onclick="showPasswordModal()" class="card">
                <div class="icon">🔑</div>
                <div class="title">Change Password</div>
                <div class="desc">Update your login credentials</div>
            </a>
        </div>
    </div>

    <!-- Menu Management Section Removed -->

    <script src="auth.js"></script>
    <script>
        checkAuth('vendor');

        const API = '/food-api';

        // Get Vendor ID from URL or Session
        const params = new URLSearchParams(window.location.search);
        let vendorId = params.get("vendor_id") || sessionStorage.getItem("vendor_id");

        if (!vendorId) {
            alert("No vendor ID found. Please login.");
            window.location.href = "login.html";
        }

        // Update Links
        document.getElementById("dash-link").href = `vendor-live.html?vendor_id=${vendorId}`;
        document.getElementById("sum-link").href = `vendor-stats.html?vendor_id=${vendorId}`;
        document.getElementById("menu-link").href = `vendor-menu.html?vendor_id=${vendorId}`;

        document.getElementById("menu-link").href = `vendor-menu.html?vendor_id=${vendorId}`;

        // Password Change Logic
        function showPasswordModal() {
            const modal = document.createElement('div');
            modal.id = 'pwd-modal';
            modal.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:flex;justify-content:center;align-items:center;z-index:1000;';
            modal.innerHTML = `
            <div style="background:white;padding:25px;border-radius:15px;width:90%;max-width:350px;">
                <h3 style="margin-top:0;">Change Password</h3>
                <input type="password" id="oldPwd" placeholder="Old Password" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">
                <input type="password" id="newPwd" placeholder="New Password" style="width:100%;padding:10px;margin-bottom:10px;border:1px solid #ddd;border-radius:8px;">
                <button onclick="changePassword()" style="width:100%;padding:10px;background:var(--primary);color:white;border:none;border-radius:8px;font-weight:bold;margin-bottom:10px;">Update</button>
                <button onclick="document.getElementById('pwd-modal').remove()" style="width:100%;padding:10px;background:#eee;color:black;border:none;border-radius:8px;">Cancel</button>
            </div>
        `;
            document.body.appendChild(modal);
        }

        async function changePassword() {
            const oldPwd = document.getElementById('oldPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            if (!oldPwd || !newPwd) return alert("Please fill all fields");

            try {
                const res = await authFetch(`${API}/change-password`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ vendorId: vendorId, oldPassword: oldPwd, newPassword: newPwd })
                });
                const data = await res.json();
                if (data.success) {
                    alert("Password updated successfully!");
                    document.getElementById('pwd-modal').remove();
                } else {
                    alert(data.error || "Failed to update password");
                }
            } catch (e) {
                alert("Error updating password");
            }
        }
    </script>

</html>
