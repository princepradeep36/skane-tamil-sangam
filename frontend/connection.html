<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Connection Game | Skåne Tamil Sangam</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(170deg,#003d80,#0056b3 60%,#0b75d1);color:#fff;display:flex;flex-direction:column;min-height:100dvh;-webkit-tap-highlight-color:transparent}
header{padding:16px 18px 6px;text-align:center}
header b{display:block;font-size:1.2rem;letter-spacing:.02em}
header span{color:#ffd76a;font-weight:600;font-size:.9rem}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px;text-align:center}
.join{width:min(360px,100%);background:#fff;color:#1c1c1e;border-radius:20px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.join h1{margin:0 0 6px;font-size:1.5rem;color:#003d80}
.join p{margin:0 0 16px;color:#57534e}
.join input{width:100%;font-size:1.1rem;padding:14px;border:1.5px solid #d0d5dd;border-radius:12px}
.join button{width:100%;margin-top:12px;font-size:1.15rem;font-weight:800;padding:14px;border:0;border-radius:12px;background:#ffc107;color:#1c1c1e;cursor:pointer}
.err{color:#b42318;font-weight:600;margin-top:10px;min-height:1.2em}
.buzz{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;font-size:clamp(1.6rem,8vw,2.3rem);font-weight:900;line-height:1.15;color:#3d2c06;background:radial-gradient(circle at 35% 30%,#ffe08a,#ffc107 60%,#e0a100);box-shadow:0 14px 0 #b98500,0 26px 40px rgba(0,0,0,.35);cursor:pointer;touch-action:manipulation;user-select:none}
.buzz:active{transform:translateY(10px);box-shadow:0 4px 0 #b98500,0 10px 20px rgba(0,0,0,.35)}
.big{font-size:clamp(1.7rem,8vw,2.4rem);font-weight:900;line-height:1.2;margin:0}
.sub{font-size:1.1rem;margin:0;opacity:.92;line-height:1.45;max-width:340px}
.emoji{font-size:4.5rem;line-height:1}
.panel{width:min(360px,100%);padding:26px 20px;border-radius:22px;background:rgba(255,255,255,.12)}
.panel.go{background:#16a34a;animation:pulse 1s infinite}
.panel.wait{background:rgba(255,193,7,.22)}
.panel.bad{background:rgba(220,38,38,.35)}
.panel.win{background:#16a34a}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 18px rgba(255,255,255,0)}}
.howto{width:min(360px,100%);background:rgba(255,255,255,.12);border-radius:18px;padding:16px 18px;text-align:left}
.howto h2{margin:0 0 10px;font-size:1.1rem;color:#ffd76a}
.howto ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.howto li{display:flex;gap:10px;align-items:flex-start;line-height:1.4;font-size:.98rem}
.howto li span{flex:0 0 auto;font-size:1.2rem;line-height:1.3}
.points{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.points div{background:#fff;color:#003d80;border-radius:12px;padding:10px 6px;text-align:center;font-size:.82rem;font-weight:700;line-height:1.3}
.points b{display:block;font-size:1.7rem;line-height:1.1;color:#b26a00}
.worth{display:inline-block;background:#ffc107;color:#3d2c06;font-weight:900;border-radius:999px;padding:8px 18px;font-size:1.1rem}
body.clue{background:linear-gradient(170deg,#3d0815,#64101f 55%,#9b1b33)}
body.clue header span{color:#f6c343}
body.clue .points div{color:#64101f}
body.clue .points b{color:#a3122e}
.answer{width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.answer input{width:100%;font-size:1.2rem;padding:15px 14px;border:0;border-radius:14px;color:#1c1c1e;text-align:center}
.answer button{font-size:1.15rem;font-weight:800;padding:14px;border:0;border-radius:14px;background:#ffc107;color:#1c1c1e;cursor:pointer}
.answer button:disabled{opacity:.6}
.answer .note{font-size:.88rem;opacity:.85;margin:0}
.sent{background:#fff;color:#1c1c1e;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:1.05rem}
.sent b{display:block;font-size:1.35rem;word-break:break-word}
body.clue .answer button{background:#f6c343;color:#3d0815}
footer{padding:10px 16px 16px;text-align:center;font-size:.9rem;opacity:.85}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b id="gameTitle">🪔 Connection Game</b><span id="progress">Skåne Tamil Sangam</span></header>
<main id="app"></main>
<footer id="who"></footer>
<script>
const API = '/food-api';
// ?game=clue runs the Clue game (text clues); otherwise the Connection game (images).
const GAME = new URLSearchParams(location.search).get('game') === 'clue' ? 'clue' : 'connection';
const GAME_TITLE = GAME === 'clue' ? '🔎 Clue Game' : '🪔 Connection Game';
document.getElementById('gameTitle').textContent = GAME_TITLE;
if (GAME === 'clue') document.body.classList.add('clue');
document.title = `${GAME_TITLE.slice(3)} | Skåne Tamil Sangam`;
const TOKEN_KEY = `${GAME}Token`;
const app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get() { try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return memoryToken; } },
  set(v) { memoryToken = v; try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
};
let memoryToken = null;
let lastView = '';
let lastTurn = '';

function render(key, html) {
  // Only touch the page when something changed, so typing and tapping are never interrupted.
  if (key === lastView) return;
  lastView = key;
  app.innerHTML = html;
}

// Clue game scoring: 3 points after clue 1, 2 after clue 2, 1 after clue 3.
const POINT_CARDS = `<div class="points">
  <div><b>3</b>points if you guess after Clue 1</div>
  <div><b>2</b>points after Clue 2</div>
  <div><b>1</b>point after Clue 3</div>
</div>`;
const pointsText = n => `${n} point${n === 1 ? '' : 's'}`;

// Shown on the join, waiting and "not open yet" screens, before the game starts.
const HOW_TO_PLAY = GAME === 'clue'
  ? `<div class="howto"><h2>How to play</h2><ol>
  <li><span>🔎</span><div>Each place has <b>3 clues</b>, shown one by one on the stage screen.</div></li>
  <li><span>✋</span><div><b>Everyone can answer!</b> Tap <b>I want to answer</b> and type your answer on your phone.</div></li>
  <li><span>☝️</span><div>You can send <b>one answer per place</b>. Answer early for more points, or wait for more clues.</div></li>
  <li><span>✏️</span><div>Spelling mistakes are fine: the quiz master checks every answer.</div></li>
  <li><span>🏆</span><div>The answer and the scores are shown after clue 3. The highest score wins!</div></li>
  <li><span>⏱️</span><div>Same points? Whoever answered first ranks higher.</div></li>
</ol>${POINT_CARDS}</div>`
  : `<div class="howto"><h2>How to play</h2><ol>
  <li><span>🖼️</span><div>Pictures appear on the stage screen one by one. They are all connected to one answer.</div></li>
  <li><span>✋</span><div>Know the answer? Tap <b>I want to answer</b> on your phone. The fastest tap goes first.</div></li>
  <li><span>⌨️</span><div>Then <b>type your answer</b> on your phone and send it. Spelling mistakes are fine: the quiz master decides if it is right.</div></li>
  <li><span>🎤</span><div>When your phone says <b>It's your turn</b>, your answer appears on the stage screen.</div></li>
  <li><span>🔁</span><div>Wrong answer? The next person in line gets a chance. You get one try per question.</div></li>
  <li><span>🏆</span><div>Each correct answer is 1 point. The highest score wins!</div></li>
  <li><span>⏱️</span><div>Same points? Whoever reached that score first ranks higher.</div></li>
</ol></div>`;

function showJoin(status) {
  const open = status === 'LOBBY' || status === 'PLAYING';
  document.getElementById('progress').textContent = 'Skåne Tamil Sangam';
  document.getElementById('who').textContent = '';
  if (!open) {
    render('closed' + status, status === 'ENDED'
      ? `<div class="emoji">🎉</div><p class="big">The game has finished</p><p class="sub">Thank you for playing!</p>`
      : `<div class="emoji">⏳</div><p class="big">The game hasn't opened yet</p><p class="sub">This page will open by itself when it starts. Please keep it open.</p>${HOW_TO_PLAY}`);
    return;
  }
  if (lastView === 'join') return;
  render('join', `<form class="join" id="joinForm">
      <h1>Join the game</h1><p>Type the name to show on stage.</p>
      <input id="name" maxlength="30" autocomplete="name" placeholder="Your name" required>
      <button type="submit">Join</button><div class="err" id="err"></div></form>${HOW_TO_PLAY}`);
  document.getElementById('joinForm').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch(`${API}/${GAME}/join`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('name').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { document.getElementById('err').textContent = d.error || 'Could not join. Please try again.'; return; }
    store.set(d.token);
    lastView = '';
    tick();
  };
}

function showPlayer(me) {
  document.getElementById('who').textContent = `Playing as ${me.name} · Score: ${me.score}`;
  document.getElementById('progress').textContent = me.status === 'PLAYING'
    ? (GAME === 'clue'
      ? `Place ${me.questionNumber} of ${me.questionTotal} · ${me.revealed ? 'Answer shown' : `Clue ${me.step} of ${me.steps} · Worth ${pointsText(me.worth)} now`}`
      : `Question ${me.questionNumber} of ${me.questionTotal}`)
    : 'Skåne Tamil Sangam';
  if (me.turn === 'ANSWERING' && lastTurn !== 'ANSWERING' && navigator.vibrate) navigator.vibrate([200, 100, 200]);
  lastTurn = me.turn;
  if (me.status === 'LOBBY') {
    return render('lobby', `<div class="emoji">✅</div><p class="big">You're in!</p><p class="sub">Look at the stage screen. The game starts soon.</p>${HOW_TO_PLAY}`);
  }
  if (me.status === 'ENDED') {
    return render('ended' + me.score, `<div class="emoji">🎉</div><p class="big">Thanks for playing!</p><p class="sub">Your score: <b>${me.score}</b></p>`);
  }
  if (GAME === 'clue') return showClueRound(me);
  if (me.turn === 'CORRECT') {
    return render('correct' + me.questionNumber, `<div class="panel win"><div class="emoji">🏆</div><p class="big">Correct!</p>${GAME === 'clue' ? `<p class="big">+${pointsText(me.awarded)}</p>` : ''}<p class="sub">Well done. Next question coming up.</p></div>`);
  }
  if (me.revealed) {
    return render('revealed' + me.questionNumber, `<div class="emoji">👀</div><p class="big">Answer revealed</p><p class="sub">See the stage screen. Next question coming up.</p>`);
  }
  if (me.turn === 'ANSWERING' || me.turn === 'WAITING') return showAnswering(me);
  if (me.turn === 'WRONG') {
    return render('wrong' + me.questionNumber, `<div class="panel bad"><div class="emoji">🙈</div><p class="big">Not this time</p><p class="sub">${GAME === 'clue'
      ? "You can't answer this place again, even when the next clue comes. Your next chance is the next place."
      : 'You can try again on the next question.'}</p></div>`);
  }
  if (me.canBuzz) {
    const key = `buzz${me.questionNumber}-${me.worth}`;
    if (lastView !== key) {
      render(key, `${GAME === 'clue' ? `<span class="worth">⭐ Worth ${pointsText(me.worth)} now</span>` : ''}<button class="buzz" id="buzz">I want<br>to answer</button><p class="sub">Tap if you know the ${GAME === 'clue' ? 'answer' : 'connection'}. You get one try per question.</p>`);
      document.getElementById('buzz').onclick = buzz;
    }
  }
}

// After tapping "I want to answer": the player types the answer here. It is not checked;
// the quiz master sees it and decides. The form is drawn once per question so typing is never
// interrupted; only the status panel above it is updated.
function turnPanel(me) {
  const ahead = me.ahead === 1 ? '1 person is' : `${me.ahead} people are`;
  return me.turn === 'ANSWERING'
    ? `<div class="panel go"><div class="emoji">🎤</div><p class="big">It's your turn!</p><p class="sub">${me.typed
        ? 'Your answer is on the stage screen. The quiz master is deciding.'
        : 'Type your answer below and send it, or say it out loud.'}</p>${sentBox(me)}</div>`
    : `<div class="panel wait"><div class="emoji">✋</div><p class="big">You're in line</p><p class="sub">${ahead} ahead of you. ${me.typed
        ? 'Your answer is ready: it shows on stage when it is your turn.'
        : 'Type your answer below now, so it is ready when it is your turn.'}</p>${sentBox(me)}</div>`;
}
const sentBox = me => (me.typed ? `<div class="sent">Your answer<b>${esc(me.typed)}</b></div>` : '');

function showAnswering(me) {
  if (me.typed) return render(`sent${me.questionNumber}-${me.turn}-${me.ahead}`, turnPanel(me));
  if (lastView !== 'type' + me.questionNumber) {
    render('type' + me.questionNumber, `<div id="turnBox"></div>
      <form class="answer" id="answerForm">
        <input id="answerText" maxlength="100" autocomplete="off" autocapitalize="words" placeholder="Type your answer" aria-label="Your answer" required>
        <button type="submit">Send answer</button>
        <p class="note">You can send one answer. Spelling mistakes are fine: the quiz master decides.</p>
      </form>`);
    document.getElementById('answerForm').onsubmit = sendAnswer;
  }
  const box = document.getElementById('turnBox');
  const html = turnPanel(me);
  if (box.dataset.html !== html) { box.dataset.html = html; box.innerHTML = html; }
}

// Clue game: everyone may answer once per place. The form is drawn once per place (so typing is never
// interrupted when the next clue comes); only the "worth" badge above it is updated.
function showClueRound(me) {
  const q = me.questionNumber;
  if (me.revealed) {
    if (me.result && me.result.correct) return render('right' + q + '-' + me.result.points, `<div class="panel win"><div class="emoji">🏆</div><p class="big">Correct!</p><p class="big">+${pointsText(me.result.points)}</p><p class="sub">Your answer: <b>${esc(me.myAnswer.text)}</b></p></div>`);
    if (me.myAnswer) return render('miss' + q, `<div class="panel bad"><div class="emoji">🙈</div><p class="big">Not this time</p><p class="sub">Your answer: <b>${esc(me.myAnswer.text)}</b>. See the right answer on the stage screen.</p></div>`);
    return render('shown' + q, `<div class="emoji">👀</div><p class="big">Answer revealed</p><p class="sub">See the stage screen. Next place coming up.</p>`);
  }
  if (me.myAnswer) {
    return render('sent' + q, `<div class="panel wait"><div class="emoji">✅</div><p class="big">Answer sent</p>
      <div class="sent">Your answer<b>${esc(me.myAnswer.text)}</b></div>
      <p class="sub" style="margin-top:12px">Sent at clue ${me.myAnswer.clue}: <b>${pointsText(me.myAnswer.points)}</b> if correct. The answer is shown after clue 3.</p></div>`);
  }
  if (lastView !== 'ask' + q) {
    render('ask' + q, `<span class="worth" id="worthBadge"></span>
      <button class="buzz" id="buzz">I want<br>to answer</button>
      <form class="answer" id="answerForm" hidden>
        <input id="answerText" maxlength="100" autocomplete="off" autocapitalize="words" placeholder="Type your answer" aria-label="Your answer" required>
        <button type="submit">Send answer</button>
        <p class="note">One answer per place. Spelling mistakes are fine: the quiz master checks every answer.</p>
      </form>
      <p class="sub" id="askNote">Everyone can answer. Answer now for more points, or wait for the next clue.</p>`);
    document.getElementById('buzz').onclick = () => {
      document.getElementById('buzz').hidden = true;
      document.getElementById('askNote').hidden = true;
      document.getElementById('answerForm').hidden = false;
      document.getElementById('answerText').focus();
    };
    document.getElementById('answerForm').onsubmit = sendAnswer;
  }
  document.getElementById('worthBadge').textContent = `⭐ Worth ${pointsText(me.worth)} now`;
}

async function sendAnswer(e) {
  e.preventDefault();
  const input = document.getElementById('answerText');
  const btn = e.target.querySelector('button');
  if (!input.value.trim()) return;
  btn.disabled = true;
  btn.textContent = 'Sending…';
  try {
    const r = await fetch(`${API}/${GAME}/answer`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: store.get(), text: input.value }) });
    const me = await r.json().catch(() => ({}));
    if (!r.ok && !me.turn) throw new Error(me.error || 'Could not send. Please try again.');
    lastView = '';
    showPlayer(me);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Send answer';
    alert(err.message);
  }
}

async function buzz() {
  const btn = document.getElementById('buzz');
  if (btn) btn.disabled = true;
  try {
    const r = await fetch(`${API}/${GAME}/buzz`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: store.get() }) });
    const me = await r.json();
    if (r.ok) showPlayer(me); else lastView = '';
  } catch (e) { lastView = ''; }
}

async function tick() {
  try {
    const token = store.get();
    const r = await fetch(`${API}/${GAME}/me?token=${encodeURIComponent(token || '')}`, { cache: 'no-store' });
    const me = await r.json();
    if (me.needJoin) { store.set(null); showJoin(me.status); } else showPlayer(me);
  } catch (e) { /* network blip: keep what's on screen and retry */ }
}

tick();
setInterval(tick, 1200);
</script>
</body>
</html>
